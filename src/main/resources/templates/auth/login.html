<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Smart Cinema - Đăng nhập')}"></head>
<body class="bg-dark-gradient">
    <nav th:replace="~{fragments/common :: navbar}"></nav>

    <div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 70vh;">
        <div class="card bg-dark-card rounded-4 shadow-lg p-4 p-md-5 border border-secondary border-opacity-10" style="max-width: 480px; width: 100%;">
            <div class="text-center mb-4">
                <h1 class="text-gradient fw-bold mb-1">🎬 Smart Cinema</h1>
                <p class="text-white-50">Đăng nhập tài khoản để đặt vé xem phim</p>
            </div>

            <!-- Server Error -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-3 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Đăng nhập thất bại!</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post">
                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold text-white">Địa chỉ Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-white-50"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" th:field="*{email}" class="form-control bg-transparent text-white border-secondary border-opacity-25" placeholder="email@example.com" required>
                    </div>
                    <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback d-block" th:errors="*{email}">Lỗi email</div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold text-white">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-white-50"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" th:field="*{password}" class="form-control bg-transparent text-white border-secondary border-opacity-25" placeholder="Nhập mật khẩu" required>
                    </div>
                    <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback d-block" th:errors="*{password}">Lỗi mật khẩu</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 shadow fw-bold">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
                <p class="text-white-50 mb-0">Chưa có tài khoản? <a th:href="@{/auth/register}" class="text-info fw-semibold text-decoration-none">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
