<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Smart Cinema - Đăng ký')}"></head>
<body class="bg-dark-gradient">
    <nav th:replace="~{fragments/common :: navbar}"></nav>

    <div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="card bg-dark-card rounded-4 shadow-lg p-4 p-md-5 border border-secondary border-opacity-10" style="max-width: 520px; width: 100%;">
            <div class="text-center mb-4">
                <h1 class="text-gradient fw-bold mb-1">🎬 Đăng ký tài khoản</h1>
                <p class="text-white-50">Tạo tài khoản mới để bắt đầu trải nghiệm xem phim</p>
            </div>

            <!-- Server Error -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-3 mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Đăng ký thất bại!</span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post">
                <!-- Full name -->
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold text-white">Họ và tên <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-white-50"><i class="bi bi-person"></i></span>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control bg-transparent text-white border-secondary border-opacity-25" placeholder="Nguyễn Văn A" required>
                    </div>
                    <div th:if="${#fields.hasErrors('fullName')}" class="invalid-feedback d-block" th:errors="*{fullName}">Lỗi họ tên</div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold text-white">Địa chỉ Email <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-white-50"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" th:field="*{email}" class="form-control bg-transparent text-white border-secondary border-opacity-25" placeholder="email@example.com" required>
                    </div>
                    <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback d-block" th:errors="*{email}">Lỗi email</div>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label for="phone" class="form-label fw-semibold text-white">Số điện thoại</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-white-50"><i class="bi bi-telephone"></i></span>
                        <input type="text" id="phone" th:field="*{phone}" class="form-control bg-transparent text-white border-secondary border-opacity-25" placeholder="0912345678">
                    </div>
                    <div th:if="${#fields.hasErrors('phone')}" class="invalid-feedback d-block" th:errors="*{phone}">Lỗi số điện thoại</div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold text-white">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-white-50"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" th:field="*{password}" class="form-control bg-transparent text-white border-secondary border-opacity-25" placeholder="Tối thiểu 6 ký tự" required>
                    </div>
                    <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback d-block" th:errors="*{password}">Lỗi mật khẩu</div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold text-white">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-secondary border-opacity-25 text-white-50"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control bg-transparent text-white border-secondary border-opacity-25" placeholder="Nhập lại mật khẩu" required>
                    </div>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" class="invalid-feedback d-block" th:errors="*{confirmPassword}">Lỗi xác nhận</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 shadow fw-bold">
                    <i class="bi bi-person-plus me-2"></i> Đăng ký
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
                <p class="text-white-50 mb-0">Đã có tài khoản? <a th:href="@{/auth/login}" class="text-info fw-semibold text-decoration-none">Đăng nhập</a></p>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
