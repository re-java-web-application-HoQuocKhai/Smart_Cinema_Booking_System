<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>In Vé - Smart Cinema</title>
    <!-- Use basic Bootstrap for layout, but override with print-specific styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f0f0;
            font-family: 'Courier New', Courier, monospace;
            color: #000;
        }
        
        .ticket-container {
            max-width: 400px;
            margin: 20px auto;
            background: #fff;
            padding: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .ticket {
            padding: 20px;
            border-bottom: 2px dashed #ccc;
        }
        
        .ticket:last-child {
            border-bottom: none;
        }

        .cinema-header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .cinema-header h2 {
            font-weight: bold;
            font-size: 1.5rem;
            margin: 0;
            letter-spacing: 2px;
        }
        
        .movie-title {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .seat-info {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 5px;
        }

        .barcode {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ccc;
        }
        
        .barcode img {
            max-width: 100%;
            height: 50px;
            opacity: 0.8;
        }

        .print-btn-container {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        @media print {
            body {
                background: none;
                margin: 0;
            }
            .ticket-container {
                box-shadow: none;
                margin: 0;
                width: 100%;
            }
            .print-btn-container {
                display: none !important;
            }
            .ticket {
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <div class="print-btn-container">
        <button class="btn btn-primary btn-lg rounded-pill px-5" onclick="window.print()">
            <i class="bi bi-printer me-2"></i> In lại
        </button>
        <div class="mt-2 text-muted small">Quá trình in sẽ tự động bắt đầu...</div>
    </div>

    <div class="ticket-container">
        <!-- Loop through each ticket to print separately -->
        <div class="ticket" th:each="ticket : ${booking.tickets}">
            <div class="cinema-header">
                <h2>SMART CINEMA</h2>
                <div class="small mt-1" th:text="${ticket.cinemaNameSnapshot}">Tên rạp</div>
            </div>
            
            <div class="movie-title" th:text="${ticket.movieTitleSnapshot}">Tên Phim</div>
            
            <div class="info-row">
                <span>Ngày chiếu:</span>
                <strong th:text="${#temporals.format(ticket.showtimeSnapshot, 'dd/MM/yyyy')}">21/05/2026</strong>
            </div>
            <div class="info-row">
                <span>Giờ chiếu:</span>
                <strong th:text="${#temporals.format(ticket.showtimeSnapshot, 'HH:mm')}">10:00</strong>
            </div>
            <div class="info-row">
                <span>Phòng chiếu:</span>
                <strong th:text="${ticket.roomNameSnapshot}">Room 1</strong>
            </div>
            <div class="info-row">
                <span>Loại ghế:</span>
                <span th:text="${ticket.seatTypeSnapshot}">Thường</span>
            </div>
            
            <div class="seat-info">
                GHẾ: <span th:text="${ticket.seatLabelSnapshot}">A1</span>
            </div>
            
            <div class="info-row small text-muted mt-3">
                <span>Mã đơn: <span th:text="${booking.bookingCode}">BK123</span></span>
                <span th:text="${#temporals.format(booking.paidAt, 'dd/MM HH:mm')}">21/05 09:30</span>
            </div>
            
            <div class="barcode">
                <!-- A placeholder barcode since we don't have a real barcode generator library -->
                <svg width="200" height="50" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="0" width="200" height="50" fill="#fff" />
                    <!-- Mock vertical bars -->
                    <path d="M10 0v50M15 0v50M22 0v50M25 0v50M35 0v50M38 0v50M42 0v50M50 0v50M55 0v50M60 0v50M68 0v50M72 0v50M80 0v50M85 0v50M88 0v50M95 0v50M100 0v50M105 0v50M112 0v50M118 0v50M125 0v50M130 0v50M135 0v50M142 0v50M150 0v50M155 0v50M162 0v50M165 0v50M170 0v50M180 0v50M185 0v50M190 0v50" stroke="#000" stroke-width="2" />
                </svg>
                <div class="small fw-bold mt-1" th:text="${ticket.id} + '-' + ${booking.bookingCode}">1-BK123456</div>
            </div>
        </div>
    </div>

    <script>
        // Automatically open print dialog when page loads
        window.onload = function() {
            setTimeout(function() {
                window.print();
            }, 500);
        };
    </script>
</body>
</html>
