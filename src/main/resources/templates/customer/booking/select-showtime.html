<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Smart Cinema - Chọn Suất Chiếu')}"></head>
<body class="bg-dark-gradient">
    <nav th:replace="~{fragments/common :: navbar}"></nav>

    <div class="container py-5">
        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="text-gradient fw-bold"><i class="bi bi-ticket-perforated"></i> Đặt vé xem phim</h1>
            <p class="text-white-50">Chọn một suất chiếu đang mở bán dưới đây để đặt chỗ</p>
        </div>

        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-3 mb-4" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-3 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- No Showtimes -->
        <div th:if="${#lists.isEmpty(showtimes)}" class="text-center py-5">
            <i class="bi bi-calendar-x text-white-50 fs-1 d-block mb-3 animate-pulse"></i>
            <h3 class="text-white">Hiện không có suất chiếu nào</h3>
            <p class="text-white-50">Vui lòng quay lại sau khi có lịch chiếu mới.</p>
        </div>

        <!-- Showtimes Grid -->
        <div th:unless="${#lists.isEmpty(showtimes)}" class="row row-cols-1 row-cols-lg-2 g-4 mb-5">
            <!-- Showtime Card Item -->
            <div class="col" th:each="s : ${showtimes}">
                <div class="card bg-dark-card rounded-4 overflow-hidden border border-secondary border-opacity-10 shadow-lg h-100 transition-all movie-card-hover" style="transition: transform 0.3s;">


                    <div class="row g-0 h-100">
                        <!-- Left half: Poster -->
                        <div class="col-sm-5 bg-black position-relative" style="min-height: 250px;">
                            <img th:if="${s.movie.posterUrl}" th:src="${s.movie.posterUrl}" class="w-100 h-100 object-fit-cover position-absolute top-0 start-0" alt="Poster">
                            <div th:unless="${s.movie.posterUrl}" class="w-100 h-100 d-flex flex-column align-items-center justify-content-center text-white-50">
                                <i class="bi bi-image fs-1 mb-2"></i>
                                <span class="small">Chưa có poster</span>
                            </div>
                            <!-- Age Rating Badge -->
                            <div class="position-absolute top-0 start-0 m-3 z-1">
                                <span class="badge bg-secondary bg-opacity-75 text-white rounded-pill px-3 py-1.5 fw-semibold" th:text="${s.movie.ageRating ?: 'P'}">T16</span>
                            </div>
                        </div>

                        <!-- Right half: Details -->
                        <div class="col-sm-7 p-4 d-flex flex-column justify-content-between">
                            <div>
                                <h3 class="text-white fw-bold mb-2 text-truncate-2" th:text="${s.movie.title}">Tên phim</h3>
                                <div class="d-flex align-items-center gap-2 mb-3 text-white-50 small">
                                    <span><i class="bi bi-clock me-1"></i> <span th:text="${s.movie.durationMinutes + ' phút'}">120p</span></span>
                                    <span>&bull;</span>
                                    <span class="text-info"><i class="bi bi-badge-3d me-1"></i> <span th:text="${s.room.roomType}">3D</span></span>
                                </div>

                                <!-- Cinema & Room -->
                                <div class="mb-3">
                                    <div class="text-white fw-semibold small"><i class="bi bi-building me-1"></i> Rạp: <span class="text-white-50" th:text="${s.room.cinema.name}">Rạp phim</span></div>
                                    <div class="text-white fw-semibold small mt-1"><i class="bi bi-door-open me-1"></i> Phòng: <span class="text-white-50" th:text="${s.room.name}">Phòng 1</span></div>
                                </div>

                                <!-- Showtime Details -->
                                <div class="p-3 bg-black bg-opacity-25 rounded-3 border border-secondary border-opacity-10 mb-3 d-flex align-items-center justify-content-between">
                                    <div>
                                        <div class="text-white-50 small mb-1">Giờ chiếu:</div>
                                        <div class="text-white fw-bold fs-3" th:text="${#temporals.format(s.startTime, 'HH:mm')}">08:00</div>
                                        <div class="text-white-50 small" th:text="${#temporals.format(s.startTime, 'dd/MM/yyyy')}">20/05/2026</div>
                                    </div>
                                    <div class="text-end">
                                        <div class="text-white-50 small mb-1">Giá vé cơ bản:</div>
                                        <div class="text-gradient fw-bold fs-5" th:text="${#numbers.formatInteger(s.basePrice.intValue(), 3, 'COMMA') + ' đ'}">75,000 đ</div>
                                    </div>
                                </div>
                            </div>

                            <!-- CTA Button -->
                            <div>
                                <th:block th:if="${soldOutMap.get(s.id)}">
                                    <a th:href="@{/customer/booking/seats/{id}(id=${s.id})}" class="btn btn-secondary w-100 rounded-pill py-2">
                                        <i class="bi bi-circle-fill me-2 text-danger small"></i> Hết vé - Xem sơ đồ
                                    </a>
                                </th:block>
                                <th:block th:unless="${soldOutMap.get(s.id)}">
                                    <a th:href="@{/customer/booking/seats/{id}(id=${s.id})}" class="btn btn-primary w-100 rounded-pill py-2 shadow-sm">
                                        <i class="bi bi-ticket-perforated-fill me-2"></i> Chọn ghế ngay
                                    </a>
                                </th:block>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
