<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Smart Cinema - Hồ sơ cá nhân')}"></head>
<body class="bg-dark-gradient d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/common :: navbar}"></nav>

    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Success message -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show bg-success bg-opacity-10 text-success border border-success border-opacity-25 rounded-4 mb-4 shadow" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${success}">Cập nhật thành công!</span>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Main Card -->
                <div class="card bg-dark-card rounded-4 p-4 p-md-5 shadow-lg border-secondary border-opacity-25">
                    <div class="row g-4 align-items-center">
                        
                        <!-- Left: Avatar Column -->
                        <div class="col-md-4 text-center border-end border-secondary border-opacity-10 pe-md-4 py-3">
                            <div class="avatar-placeholder rounded-circle bg-dark-gradient d-inline-flex align-items-center justify-content-center mb-3 shadow-lg" 
                                 style="width: 120px; height: 120px; border: 2px solid var(--accent-primary);">
                                <i class="bi bi-person-fill fs-1 text-gradient"></i>
                            </div>
                            <h3 class="fw-bold text-white mb-2" th:text="${profile.fullName ?: 'Thành viên'}">Họ và tên</h3>
                            <span class="badge rounded-pill px-3 py-2 fs-6 shadow-sm"
                                  th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger text-white' : (${user.role.name() == 'STAFF'} ? 'bg-warning text-dark' : 'bg-success text-white')"
                                  th:text="${user.role}">ROLE</span>
                        </div>

                        <!-- Right: Detailed Info Column -->
                        <div class="col-md-8 ps-md-4">
                            <h2 class="text-gradient fw-bold mb-4 d-flex align-items-center gap-2">
                                <i class="bi bi-card-text"></i> Thông tin tài khoản
                            </h2>

                            <div class="row g-3">
                                <!-- Email -->
                                <div class="col-sm-6">
                                    <div class="p-3 bg-secondary bg-opacity-10 rounded-3 border border-secondary border-opacity-10 d-flex align-items-center gap-3">
                                        <div class="text-primary fs-4"><i class="bi bi-envelope-fill text-gradient"></i></div>
                                        <div>
                                            <small class="text-white-50 d-block text-uppercase fw-semibold" style="font-size: 0.75rem;">Email</small>
                                            <span class="text-white fw-semibold" th:text="${user.email}">email@example.com</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Họ và tên -->
                                <div class="col-sm-6">
                                    <div class="p-3 bg-secondary bg-opacity-10 rounded-3 border border-secondary border-opacity-10 d-flex align-items-center gap-3">
                                        <div class="text-primary fs-4"><i class="bi bi-person-vcard-fill text-gradient"></i></div>
                                        <div>
                                            <small class="text-white-50 d-block text-uppercase fw-semibold" style="font-size: 0.75rem;">Họ và tên</small>
                                            <span class="text-white fw-semibold" th:text="${profile.fullName ?: '(Chưa cập nhật)'}">Tên</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Số điện thoại -->
                                <div class="col-sm-6">
                                    <div class="p-3 bg-secondary bg-opacity-10 rounded-3 border border-secondary border-opacity-10 d-flex align-items-center gap-3">
                                        <div class="text-primary fs-4"><i class="bi bi-telephone-fill text-gradient"></i></div>
                                        <div>
                                            <small class="text-white-50 d-block text-uppercase fw-semibold" style="font-size: 0.75rem;">Số điện thoại</small>
                                            <span class="text-white fw-semibold" th:text="${profile.phone ?: '(Chưa cập nhật)'}">SĐT</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Ngày sinh -->
                                <div class="col-sm-6">
                                    <div class="p-3 bg-secondary bg-opacity-10 rounded-3 border border-secondary border-opacity-10 d-flex align-items-center gap-3">
                                        <div class="text-primary fs-4"><i class="bi bi-calendar3 text-gradient"></i></div>
                                        <div>
                                            <small class="text-white-50 d-block text-uppercase fw-semibold" style="font-size: 0.75rem;">Ngày sinh</small>
                                            <span class="text-white fw-semibold" th:text="${profile.dateOfBirth ?: '(Chưa cập nhật)'}">Ngày sinh</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Giới tính -->
                                <div class="col-sm-6">
                                    <div class="p-3 bg-secondary bg-opacity-10 rounded-3 border border-secondary border-opacity-10 d-flex align-items-center gap-3">
                                        <div class="text-primary fs-4"><i class="bi bi-gender-ambiguous text-gradient"></i></div>
                                        <div>
                                            <small class="text-white-50 d-block text-uppercase fw-semibold" style="font-size: 0.75rem;">Giới tính</small>
                                            <span class="text-white fw-semibold" th:text="${profile.gender ?: '(Chưa cập nhật)'}">Giới tính</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Buttons Section -->
                            <div class="mt-4 pt-3 border-top border-secondary border-opacity-10 d-flex flex-wrap gap-2">
                                <a th:href="@{/profile/edit}" class="btn btn-primary rounded-pill px-4">
                                    <i class="bi bi-pencil-square me-2"></i> Chỉnh sửa hồ sơ
                                </a>
                                <a th:href="@{/home}" class="btn btn-outline-secondary rounded-pill px-4">
                                    <i class="bi bi-house-door me-2"></i> Về trang chủ
                                </a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <div th:replace="~{fragments/common :: scripts}"></div>
</body>
</html>
